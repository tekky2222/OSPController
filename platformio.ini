; Shared layout with Arduino IDE: sketch in OSPController/, library in OSPController/libraries/

[platformio]
src_dir = OSPController
lib_dir = OSPController/libraries

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
  PubSubClient
  ModbusMaster
  plerup/espsoftwareserial
extra_scripts = pre:utils.py
build_unflags = -fno-rtti ; allow dynamic_cast in powerSupplies.cpp
