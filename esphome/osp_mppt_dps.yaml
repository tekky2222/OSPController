# OSP MPPT — ESPHome nativo (fonte DPS / Modbus RTU apenas)
# Lógica de controle portada de OSPController/solar.cpp → mppt_dps_logic.h
#
#   esphome run osp_mppt_dps.yaml
#   esphome compile osp_mppt_dps.yaml

substitutions:
  device_name: osp-mppt-dps
  friendly_name: OSP MPPT DPS
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO16
  modbus_baud: "19200"
  modbus_address: "1"
  # true = DPS5020 (corrente x100); false = DPS5005 etc. (x1000)
  dps5020: "false"
  mppt_pgain: "0.005"
  mppt_ramplimit: "12"
  mppt_current_cap: "8.5"
  mppt_meas_ms: "500"
  mppt_adjust_ms: "2000"
  mppt_autosweep_s: "600"
  # Fuso para reinício diário (meia-noite) e mensal (dia 1)
  timezone: "America/Sao_Paulo"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  includes:
    - mppt_dps_logic.h
  project:
    name: opensolarproject.osp_mppt_dps
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          id(mppt_off_threshold) = 1000.0f;
          id(mppt_state) = 1;
          id(mppt_next_autosweep) = millis() + 10000;
          id(dps_is_5020) = ${dps5020};
          id(dps_current_scale) = id(dps_is_5020) ? 100.0f : 1000.0f;
      - component.update: dps_model
      - lambda: |-
          if (!isnan(id(dps_model).state) && (int) id(dps_model).state == 5020) {
            id(dps_is_5020) = true;
            id(dps_current_scale) = 100.0f;
            ESP_LOGI("mppt", "DPS5020: escala corrente x100");
          }
      - lambda: 'osp_mppt::publish_energy_sensors();'

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-setup"
    password: !secret ap_password

captive_portal:

web_server:

uart:
  id: uart_dps
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${modbus_baud}

modbus:
  id: modbus_bus
  uart_id: uart_dps
  send_wait_time: 200ms

modbus_controller:
  - id: dps
    modbus_id: modbus_bus
    address: ${modbus_address}
    setup_priority: -10

# --- Modbus DPS (registos 0x0000..0x0009, 0x000B) ---
sensor:
  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_limit_volt
    internal: true
    address: 0
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_limit_curr
    internal: true
    address: 1
    register_type: holding
    value_type: U_WORD
    filters:
      - lambda: return x / id(dps_current_scale);

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_out_volt
    name: "Output Voltage"
    address: 2
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_out_curr
    name: "Output Current"
    address: 3
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: A
    accuracy_decimals: 3
    filters:
      - lambda: return x / id(dps_current_scale);

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_in_volt
    name: "Solar Input Voltage"
    address: 5
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    on_value:
      then:
        - lambda: 'id(mppt_in_volt) = x;'

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_model
    internal: true
    address: 11
    register_type: holding
    value_type: U_WORD

  - platform: template
    id: mppt_power
    name: "Output Power"
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never
    lambda: 'return id(dps_out_volt).state * id(dps_out_curr).state;'

  - platform: template
    id: mppt_energy_total
    name: "Solar Energy Total"
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:solar-power
    update_interval: never
    lambda: 'return id(mppt_wh_total);'

  - platform: template
    id: mppt_energy_today
    name: "Solar Energy Today"
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:calendar-today
    update_interval: never
    lambda: 'return id(mppt_wh_today);'

  - platform: template
    id: mppt_energy_month
    name: "Solar Energy This Month"
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:calendar-month
    update_interval: never
    lambda: 'return id(mppt_wh_month);'

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_cc_flag
    internal: true
    address: 8
    register_type: holding
    bitmask: 0x0001

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_out_en
    name: "DPS Output On"
    address: 9
    register_type: holding
    bitmask: 0x0001

number:
  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_set_volt
    name: "Battery Voltage Set"
    address: 0
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: V
    min_value: 0
    max_value: 80
    step: 0.01
    multiply: 0.01
    write_lambda: 'return uint16_t(x * 100.0f);'

  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_set_curr
    internal: true
    address: 1
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: A
    min_value: 0
    max_value: 25
    step: 0.001
    write_lambda: 'return uint16_t(x * id(dps_current_scale));'

  - platform: template
    id: mppt_setpoint
    name: "MPPT Vin Setpoint"
    unit_of_measurement: V
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 120
    step: 0.1
    entity_category: config

  - platform: template
    id: mppt_pgain
    name: "MPPT P Gain"
    optimistic: true
    restore_value: true
    initial_value: ${mppt_pgain}
    min_value: 0.0001
    max_value: 1
    step: 0.0001
    entity_category: config

  - platform: template
    id: mppt_ramplimit
    name: "MPPT Ramp Limit"
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: ${mppt_ramplimit}
    min_value: 0.1
    max_value: 50
    step: 0.1
    entity_category: config

  - platform: template
    id: mppt_current_cap
    name: "MPPT Current Cap"
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: ${mppt_current_cap}
    min_value: 0.1
    max_value: 30
    step: 0.1
    entity_category: config

  - platform: template
    id: mppt_autosweep
    name: "MPPT Auto Sweep"
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    initial_value: ${mppt_autosweep_s}
    min_value: 0
    max_value: 86400
    step: 60
    entity_category: config

switch:
  - platform: modbus_controller
    modbus_controller_id: dps
    id: dps_output_switch
    name: "DPS Output"
    address: 9
    register_type: holding
    bitmask: 0x0001

  - platform: template
    id: mppt_enable
    name: "MPPT Enable"
    icon: mdi:solar-power
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - switch.turn_on: dps_output_switch
    turn_off_action:
      - switch.turn_off: dps_output_switch

globals:
  - id: dps_current_scale
    type: float
    initial_value: "1000"
  - id: dps_is_5020
    type: bool
    initial_value: ${dps5020}
  - id: mppt_in_volt
    type: float
    initial_value: "0"
  - id: mppt_curr_filt
    type: float
    initial_value: "0"
  - id: mppt_off_threshold
    type: float
    restore_value: true
    initial_value: "1000"
  - id: mppt_state
    type: int
    initial_value: "1"
  - id: mppt_backoff
    type: int
    initial_value: "0"
  - id: mppt_next_adjust_ms
    type: uint32_t
    initial_value: "0"
  - id: mppt_next_autosweep
    type: uint32_t
    initial_value: "0"
  - id: mppt_last_autosweep
    type: uint32_t
    initial_value: "0"
  - id: mppt_last_desired
    type: float
    initial_value: "0"
  - id: mppt_wh_total
    type: float
    restore_value: true
    initial_value: "0"
  - id: mppt_wh_today
    type: float
    restore_value: true
    initial_value: "0"
  - id: mppt_wh_month
    type: float
    restore_value: true
    initial_value: "0"
  - id: mppt_energy_last_ms
    type: uint32_t
    initial_value: "0"

text_sensor:
  - platform: template
    id: mppt_state_text
    name: "MPPT State"
    icon: mdi:state-machine
    update_interval: 1s
    lambda: |-
      switch (id(mppt_state)) {
        case 0: return {"off"};
        case 1: return {"mppt"};
        case 2: return {"sweeping"};
        case 3: return {"full_cv"};
        case 4: return {"capped"};
        case 5: return {"collapsemode"};
        case 6: return {"error"};
        default: return {"?"};
      }

button:
  - platform: template
    name: "MPPT Sweep"
    icon: mdi:chart-timeline-variant
    on_press:
      - lambda: 'osp_mppt::start_sweep();'

  - platform: template
    name: "MPPT Restore Collapse"
    icon: mdi:restart
    on_press:
      - lambda: 'osp_mppt::restore_from_collapse(id(mppt_curr_filt) * 0.95f);'

  - platform: template
    name: "Reset Energy Total"
    icon: mdi:counter
    entity_category: config
    on_press:
      - lambda: |-
          id(mppt_wh_total) = 0;
          osp_mppt::publish_energy_sensors();
          ESP_LOGI("energy", "total reiniciado manualmente");

time:
  - platform: sntp
    id: mppt_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: 'osp_mppt::reset_daily_energy();'
      - seconds: 0
        minutes: 0
        hours: 0
        days_of_month: 1
        then:
          - lambda: 'osp_mppt::reset_monthly_energy();'

interval:
  # Medição + MPPT proporcional + sweep (measperiod; x2 durante sweep)
  - interval: ${mppt_meas_ms}ms
    then:
      - lambda: |-
          if (!id(mppt_enable).state) return;
          osp_mppt::tick_measure();

  # Ajuste de corrente com backoff
  - interval: ${mppt_adjust_ms}ms
    then:
      - lambda: |-
          if (!id(mppt_enable).state) return;
          uint32_t now = millis();
          int period = osp_mppt::backoff_period(${mppt_adjust_ms});
          if (now < id(mppt_next_adjust_ms)) return;
          osp_mppt::tick_adjust();
          id(mppt_next_adjust_ms) = now + period;

  # Varredura automática
  - interval: 5s
    then:
      - lambda: |-
          if (!id(mppt_enable).state) return;
          osp_mppt::tick_autosweep();

  # Status no log
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("mppt", "Vin=%.1f set=%.1f Ilim=%.2f st=%d | Wh hoje=%.1f mes=%.1f total=%.1f",
            id(mppt_in_volt), id(mppt_setpoint).state,
            id(dps_limit_curr).state, id(mppt_state),
            id(mppt_wh_today), id(mppt_wh_month), id(mppt_wh_total);
